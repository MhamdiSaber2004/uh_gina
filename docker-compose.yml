services:
  mongodb:
    image: mongo:7
    container_name: uh_gina_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=uh_gina
    volumes:
      - mongo_data:/data/db
    networks:
      - uh_gina_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uh_gina_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URL=mongodb://mongodb:27017/uh_gina
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_uh_gina_2026}
      - JWT_EXPIRE=7d
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - ./demoData:/app/demoData
    networks:
      - uh_gina_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: uh_gina_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - uh_gina_network

volumes:
  mongo_data:

networks:
  uh_gina_network:
    driver: bridge
